    <h1>Erzieher*innen im Kindergarten</h1>


    <main class="main">
        <h2>
            Erzieher Liste
            <section id="educator-list"></section>
        </h2>
        

        <h2>Neue Erzieher hinzufügen</h2>

        <form id="educator-form">
            <input type="text" id="firstname" placeholder="Vorname" required>
            <input type="text" id="lastname" placeholder="Nachname" required>
            <input type="number" id="age" placeholder="Alter" min="18" max="65" required>

            <h3>Adresse</h3>
            <input type="text" id="street" placeholder="Straße" required>
            <input type="text" id="plz" placeholder="PLZ" max="5" required>
            <input type="text" id="houseNumber" placeholder="Hausnummer" required>

            <h3>Kontakt</h3>
            <input type="text" id="email" placeholder="Email" required>
            <input type="number" id="Telefon" placeholder="Telefonnummer" required>
            

            <button type="submit">Erstellen</button>
        </form>

    </main>
