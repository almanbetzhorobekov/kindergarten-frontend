        <h2>
            Erzieher Liste
            <section id="educator-list"></section>
        </h2>
        
        <h2>Neue Erzieher hinzufügen</h2>
    
    <section class="educators">
        <form id="educator-form">
            <input type="text" id="firstName" name="firstName" placeholder="Vorname" required>
            <input type="text" id="lastName" name="lastName" placeholder="Nachname" required>
            <input type="date" id="birthday" name="birthday" placeholder="Geburtsdatum" required>

            <input type="text" id="street" name="street" placeholder="Straße" required>
            <input type="text" id="houseNumber" name="houseNumber" placeholder="Hausnummer" required>
            <input type="text" id="plz" name="plz" placeholder="PLZ" required>

            <input type="email" id="email" name="email" placeholder="Email" required>
            <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Telefonnummer" required>

            <select id="kindergartenSelect" name="kindergartenSelect" required>
                <option value="">Wähle Kindergarten</option>
            </select>

            <select id="groupSelect" name="groupSelect" class="gruppe" required>
                <option value="">Bitte die Gruppe auswählen...</option>
            </select>

            <button type="submit">Erstellen</button>
        </form>
    </section>

    <h2>
        Erzieher Liste
        <section id="educator-list"></section>
    </h2>
